name: Build Alpha Super APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Initialize Flutter App if missing
        run: |
          if [ ! -f "pubspec.yaml" ]; then
            flutter create . --project-name alpha_super
          fi
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: alpha-super-apk
          path: build/app/outputs/flutter-apk/app-release.apk

        
