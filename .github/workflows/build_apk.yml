name: Build Alpha Super APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Initialize Flutter App if missing
        run: |
          if [ ! -d "android" ]; then
            flutter create . --project-name alpha_super
          fi
      - name: Enable Internet & Block Screenshots
        run: |
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <application/' android/app/src/main/AndroidManifest.xml
          MAIN_KT=$(find android/app/src/main/kotlin -name "MainActivity.kt")
          PKG_LINE=$(grep "^package " "$MAIN_KT")
          cat << EOF > "$MAIN_KT"
          $PKG_LINE

          import android.os.Bundle
          import android.view.WindowManager
          import io.flutter.embedding.android.FlutterActivity

          class MainActivity: FlutterActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.addFlags(WindowManager.LayoutParams.FLAG_SECURE)
              }
          }
          EOF
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: alpha-super-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Publish Direct APK Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
          
